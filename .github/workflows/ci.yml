name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  frontend-build-verification:
    name: Frontend build verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for build validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies for build validation
        run: npm install

      - name: Run frontend production build
        run: npm run build
