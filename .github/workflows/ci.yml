name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  MAVEN_OPTS: "-Dmaven.repo.local=~/.m2/repository"

jobs:
  frontend:
    name: Frontend build, lint, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine dependency manifest
        id: npm-manifest
        run: |
          if [ -f package-lock.json ]; then
            echo "path=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          elif [ -f npm-shrinkwrap.json ]; then
            echo "path=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "path=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "path=package.json" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.npm-manifest.outputs.cache }}
          cache-dependency-path: ${{ steps.npm-manifest.outputs.path }}

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-modules-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            npm-modules-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Test with coverage
        id: frontend-tests
        env:
          CI: "true"
        run: |
          node -e "const pkg=require('./package.json'); if(!pkg.scripts || !pkg.scripts.test){console.error('No npm test script defined.'); process.exit(1);}"
          npm run test -- --coverage
          echo "coverage_dir=coverage" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Upload frontend coverage
        if: steps.frontend-tests.outputs.coverage_dir
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore

  backend:
    name: Backend verify and quality gates
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache OWASP dependency data
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-${{ runner.os }}-${{ hashFiles('api/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Maven verify with coverage
        run: mvn -B -ntp clean verify

      - name: OWASP Dependency Check
        run: mvn -B -ntp org.owasp:dependency-check-maven:9.1.0:check -DdataDirectory=~/.cache/dependency-check

      - name: Checkstyle
        run: mvn -B -ntp checkstyle:check

      - name: PMD
        run: mvn -B -ntp pmd:check

      - name: SpotBugs
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:check

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            target/site/jacoco
            target/jacoco.exec
          if-no-files-found: ignore

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ secrets.GHCR_USERNAME }}/feminine-photography-portfolio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GHCR credentials
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
            echo "GHCR_USERNAME and GHCR_TOKEN secrets must be configured."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
