quarkus.application.name=feminine-photography-api
quarkus.http.root-path=/
quarkus.http.non-application-root-path=/q
quarkus.http.cors=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,UTC} %-5p [%c] (%t) %s%e%n

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:portfolio}
quarkus.datasource.password=${DB_PASSWORD:portfolio}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/feminine_portfolio}
quarkus.datasource.jdbc.max-size=16
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/feminine}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:feminine-api}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:change-me}
quarkus.oidc.application-type=service
quarkus.smallrye-jwt.enabled=true
quarkus.smallrye-jwt.verify.key.location=keys/publicKey.pem

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

quarkus.micrometer.export-prometheus.enabled=true
quarkus.micrometer.export-prometheus.path=/q/metrics

app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
app.rate-limit.refill-duration=${RATE_LIMIT_REFILL:PT1M}
app.storage.local.path=${LOCAL_STORAGE_PATH:storage/images}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.prefix=${S3_PREFIX:uploads}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.endpoint-override=${S3_ENDPOINT:}

%dev.quarkus.datasource.jdbc.url=${DEV_DB_JDBC_URL:jdbc:postgresql://localhost:5432/feminine_portfolio_dev}
%dev.quarkus.datasource.username=${DEV_DB_USER:portfolio}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:portfolio}
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.flyway.migrate-at-start=true
%dev.app.storage.local.path=${DEV_STORAGE_PATH:build/dev-images}

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/test
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.flyway.migrate-at-start=true
%test.app.storage.local.path=target/test-images

%prod.quarkus.datasource.jdbc.url=${PROD_DB_JDBC_URL}
%prod.quarkus.datasource.username=${PROD_DB_USER}
%prod.quarkus.datasource.password=${PROD_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.max-size=32
%prod.quarkus.log.console.level=INFO
%prod.quarkus.flyway.migrate-at-start=true
%prod.app.storage.s3.bucket=${PROD_S3_BUCKET}
%prod.app.storage.s3.prefix=${PROD_S3_PREFIX:uploads}
%prod.app.storage.s3.region=${PROD_S3_REGION:us-east-1}

