<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C5B9;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#B8A899" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="500" height="300" fill="url(#grad1)"/>
  <rect width="500" height="300" fill="url(#dots)"/>
  
  <text x="250" y="140" font-family="Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#5C4A6B" opacity="0.8">
    Artistic
  </text>
  <text x="250" y="180" font-family="Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#5C4A6B" opacity="0.8">
    Vision
  </text>
  
  <circle cx="80" cy="60" r="8" fill="#8B6F6F" opacity="0.3"/>
  <circle cx="420" cy="250" r="12" fill="#8B6F6F" opacity="0.2"/>
